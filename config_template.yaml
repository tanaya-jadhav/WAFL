VEP_container: "docker://ensemblorg/ensembl-vep"
SLIVAR_container: "docker://brentp/slivar"
TREXS_container: "docker://kpinpb/trexs:latest"
# annotation files
hg38_ref: "Path to Hg38 Fasta File"
HPRC_database: "hprc_deepvariant_db.vcf.gz"
RIMGC_database: "RIMGC_pbdeepvariant_db.db"
gnomad_archive: "Path to gnomad.v3.1.2.echtvar.v2.zip file" # Download from https://github.com/brentp/echtvar/releases
clinvar_archive: "resources/clinvar.echtvar.zip"
hprc_archive: "resources/pbhprc.echtvar.zip"
rimgc_archive: "resources/rimgc.echtvar.zip"
